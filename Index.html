<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página con barra superior e inferior fija</title>
  <style>
    :root{
      --bar-height:64px;
      --accent:#0ea5a3;
      --bg:#0f172a;
      --card:#0b1220;
      --text:#e6eef8;
    }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;background:linear-gradient(180deg,#0A0A6E 0%, #FF4800 100%);color:var(--text)}

    /* BARRAS FIJAS */
    .bar{
      position:fixed;
      left:0;right:0;
      height:var(--bar-height);
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 16px;
      box-sizing:border-box;
      backdrop-filter: blur(6px);
      z-index:40;
    }
    .top{top:0;border-bottom:1px solid rgba(255,255,255,0.04);}
    .bottom{bottom:0;border-top:1px solid rgba(255,255,255,0.04);justify-content:center}

    /* Botones */
    .btn{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.06);
      padding:8px 12px;
      border-radius:10px;
      color:var(--text);
      cursor:pointer;
      font-weight:600;
      display:inline-flex;align-items:center;gap:8px;
    }
    .btn:hover{transform:translateY(-2px);}

    /* Área principal entre las barras */
    main{
      padding-top:calc(var(--bar-height) + 12px);
      padding-bottom:calc(var(--bar-height) + 12px);
      min-height:100vh;
      box-sizing:border-box;
      display:flex;flex-direction:column;align-items:stretch;gap:12px;\    }

    /* Contenedor de contenido (usamos iframe para cargar páginas) */
    .content-card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:12px;
      overflow:hidden;
      margin:0 16px;
      flex:1 1 auto;
      display:flex;flex-direction:column;
    }
    iframe{
      border:0;width:100%;height:100%;min-height:800px;
    }

    /* Pequeña lista de enlaces en la barra inferior */
    .bottom .links{display:flex;gap:8px;flex-wrap:wrap}
    .badge{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.03);font-size:13px}

    /* Responsive */
    @media (max-width:640px){
      .btn{padding:8px 10px;font-size:14px}
      .bottom{padding:8px}
      .content-card{margin:0 8px}
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR (botones que cargan páginas en el iframe) -->
  <header class="bar top">
    <div style="display:flex;align-items:center;gap:12px;">
      <strong style="font-size:18px">Distribuidora Clarita</strong>
      <span style="opacity:0.6;font-size:13px">Tigre</span>
    </div>

    <nav style="margin-left:16px;display:flex;gap:8px;flex:1;overflow:auto;padding-bottom:6px">
      <!-- Cada botón tiene data-src con la URL que se mostrará en la zona principal -->
      <button class="btn" data-src= "distribuidoraclarita\Rosca.html" title="Abrir Rosca.html">Rosca</button>
      <button class="btn" data-src="distribuidoraclarita\Soldable.html" title="Abrir Soldable.html">Soldable</button>
      <button class="btn" data-src="distribuidoraclarita\DesagueSN.html" title="Abrir DesagueSN.html">Desague SN</button>
      <button class="btn" data-src="distribuidoraclarita\Reforzado.html" title="Abrir Reforzado.html">Reforzado</button>
      <button class="btn" data-src="distribuidoraclarita\Fusion.html" title="Abrir Fusion.html">Fusion</button>
      <button class="btn" data-src="distribuidoraclarita\Electrico.html" title="Abrir Electrico.html">Electrico</button>
      <button class="btn" data-src="distribuidoraclarita\Canaletas.html" title="Abrir Canaletas.html">Canaletas</button>
      <button class="btn" data-src="distribuidoraclarita\Tupy.html" title="Abrir Tupy.html">Tupy</button>
    </nav>

    <div style="display:flex;gap:8px;align-items:center">
      <input id="urlInput" placeholder="Pegar URL y Enter" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text)" />
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <div class="content-card">
      <iframe id="contentFrame" src="about:blank" title="Contenido"></iframe>
    </div>
  </main>

  <!-- BARRA INFERIOR: muestra enlaces (badges) correspondientes a los botones superiores -->
  <footer class="bar bottom">
    <div class="links" id="linksContainer">
      <!-- Los badges se generarán automáticamente desde JS a partir de los botones superiores -->
    </div>
  </footer>

  <script>
    // Inicialización: toma todos los botones y crea badges en la barra inferior
    const buttons = Array.from(document.querySelectorAll('.top .btn'));
    const linksContainer = document.getElementById('linksContainer');
    const iframe = document.getElementById('contentFrame');
    const urlInput = document.getElementById('urlInput');

    function makeBadge(text, href){
      const a = document.createElement('a');
      a.className = 'badge';
      a.href = href;
      a.textContent = text;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    }

    // Crear un badge por cada botón (usa el texto del botón y su data-src)
    buttons.forEach(btn => {
      const src = btn.dataset.src || '#';
      const badge = makeBadge(btn.textContent.trim(), src);
      linksContainer.appendChild(badge);

      // click en botón carga la URL en el iframe
      btn.addEventListener('click', () => {
        iframe.src = src;
        // opcional: marcar botón activo
        buttons.forEach(b=>b.style.opacity=1);
        btn.style.opacity = 0.8;
      });
    });

    // Permitir escribir una URL y cargarla con Enter
    urlInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        const val = urlInput.value.trim();
        if(!val) return;
        // si no tiene protocolo, añadir https://
        const url = /^(https?:)?\/\//.test(val) ? val : 'https://' + val;
        iframe.src = url;
        // crear badge temporal
        const temp = makeBadge(url.replace(/^https?:\/\//, ''), url);
        linksContainer.prepend(temp);
        urlInput.value = '';
      }
    });

    // Cargar la primera URL por defecto (si existe)
    if(buttons.length) buttons[0].click();
  </script>

  <!--
    NOTAS:
    - Reemplaza los valores data-src de los botones por las páginas que quieras mostrar.
    - Los botones cargan la URL dentro del iframe. Si la página destino lo impide (cabeceras X-Frame-Options o Content-Security-Policy), no se podrá mostrar en iframe; en ese caso los badges siguen abriendo en nueva pestaña.
    - Para páginas locales, crea la carpeta "pages" junto al archivo HTML y coloca ahi tus html.
  -->
</body>
</html>
