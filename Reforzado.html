<script>
        function copiarTexto(idElemento) {
            var elemento = document.getElementById(idElemento);
            var textoAReemplazar = elemento.innerText;

            // Crear un campo de texto oculto para copiar el texto
            var campoInput = document.createElement("input");
            campoInput.setAttribute("value", textoAReemplazar);
            document.body.appendChild(campoInput);

            // Seleccionar y copiar el texto del campo de input creado
            campoInput.select();
            document.execCommand("copy");

            // Limpiar y eliminar el campo de input
            document.body.removeChild(campoInput);

        }
    </script>
